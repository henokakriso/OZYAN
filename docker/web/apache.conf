<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www

    <Directory /var/www>
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct access to sensitive app data and config over HTTP.
    # These contain the SQLite DB (password hashes + session IDs), API keys,
    # logs and backups and must never be served to clients.
    <Directory /var/www/ozayn/database>
        Require all denied
    </Directory>

    <Directory /var/www/ozayn/backend/config>
        Require all denied
    </Directory>

    <Directory /var/www/ozayn/logs>
        Require all denied
    </Directory>

    <Directory /var/www/ozayn/backups>
        Require all denied
    </Directory>

    <Directory /var/www/ozayn/data>
        Require all denied
    </Directory>

    <Files /var/www/ozayn/install.php>
        Require all denied
    </Files>

    # Deny hidden files (e.g. .env, .git) everywhere under the app
    <Directory /var/www/ozayn>
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/ozayn>
        Options -Indexes +FollowSymLinks
        AllowOverride None

        RewriteEngine On
        RewriteRule ^$ /ozayn/ [R=301,L]
    </Directory>

    <Directory /var/www/ozayn/backend>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^api/(.*)$ api/index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ozayn-error.log
    CustomLog ${APACHE_LOG_DIR}/ozayn-access.log combined
</VirtualHost>
